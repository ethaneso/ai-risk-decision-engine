[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-risk-decision-engine"
version = "0.1.0"
description = "AI-assisted cybersecurity risk decision support"
requires-python = ">=3.12,<3.13"

# Runtime and development dependencies stay in requirements.txt and
# requirements-dev.txt so Docker and local installs use the same pins.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
